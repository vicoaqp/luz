<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Escanear Recibo SEAL</title>
    <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 450px;
        }
        h2 { text-align: center; color: #333; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; color: #555; font-weight: bold; }
        input { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        .btn-camara {
            background-color: #ff9800; color: white; padding: 12px; border: none;
            border-radius: 4px; font-size: 16px; cursor: pointer; width: 100%;
            text-align: center; display: block; box-sizing: border-box; font-weight: bold; text-decoration: none;
        }
        .btn-camara:hover { background-color: #e68a00; }
        #reciboFoto { display: none; }
        .btn-accion {
            width: 100%; padding: 10px; color: white; border: none;
            border-radius: 4px; font-size: 16px; cursor: pointer; margin-top: 5px; font-weight: bold;
        }
        #btnRotar { background-color: #6c75d6; display: none; }
        #btnRotar:hover { background-color: #5a62c4; }
        #btnEscanear { background-color: #17a2b8; display: none; }
        #btnEscanear:hover { background-color: #138496; }
        #btnEnviar { background-color: #28a745; margin-top: 15px; }
        #btnEnviar:hover { background-color: #218838; }
        #mensaje { margin-top: 15px; text-align: center; font-weight: bold; }
        .preview-container { text-align: center; margin-top: 10px; }
        .preview-img { max-width: 100%; max-height: 250px; border-radius: 4px; display: none; transform-origin: center; }
    </style>
</head>
<body>

<div class="container">
    <h2>Escanear Recibo SEAL</h2>
    
    <div class="form-group">
        <label>Fotografiar Recibo:</label>
        <input type="file" id="reciboFoto" accept="image/*" capture="environment">
        <label for="reciboFoto" class="btn-camara">📷 Tomar Foto con la Cámara</label>
        
        <div class="preview-container">
            <img id="preview" class="preview-img" alt="Vista previa">
        </div>
    </div>

    <button type="button" id="btnRotar" class="btn-accion" onclick="rotarImagen()">🔄 Girar Foto</button>
    <button type="button" id="btnEscanear" class="btn-accion" onclick="escanearRecibo()">1. Analizar Foto Escaneada</button>

    <form id="luzForm">
        <div class="form-group" style="margin-top: 15px;">
            <label for="mes">Mes Facturado:</label>
            <input type="text" id="mes" name="mes" placeholder="Ej. Abril-2026" required>
        </div>
        <div class="form-group">
            <label for="consumo">Consumo (kWh):</label>
            <input type="text" id="consumo" name="consumo" placeholder="Ej. 151" required>
        </div>
        <div class="form-group">
            <label for="monto">Total a Pagar (S/):</label>
            <input type="text" id="monto" name="monto" placeholder="Ej. 138.60" required>
        </div>
        <button type="submit" id="btnEnviar" class="btn-accion">Guardar en Google Sheet</button>
    </form>
    <div id="mensaje"></div>
</div>

<canvas id="canvas" style="display:none;"></canvas>

<script>
    // PEGA AQUÍ LA URL DE TU GOOGLE APPS SCRIPT
    const urlGoogleScript = "https://script.google.com/macros/s/AKfycbxApk01yUfmcQi8s1Z0QPbQFFzCp4IPM1IKOiDNJZZ-wY0U8GOBddx3iEMR32gFiFb_/exec";

    const inputFoto = document.getElementById('reciboFoto');
    const preview = document.getElementById('preview');
    const btnRotar = document.getElementById('btnRotar');
    const btnEscanear = document.getElementById('btnEscanear');
    
    let anguloActual = 0;
    let imagenOriginal = new Image();

    inputFoto.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                imagenOriginal.src = event.target.result;
                imagenOriginal.onload = function() {
                    anguloActual = 0;
                    preview.style.transform = `rotate(${anguloActual}deg)`;
                    preview.src = event.target.result;
                    preview.style.display = 'inline-block';
                    btnRotar.style.display = 'block';
                    btnEscanear.style.display = 'block';
                }
            }
            reader.readAsDataURL(file);
        }
    });

    function rotarImagen() {
        anguloActual = (anguloActual + 90) % 360;
        preview.style.transform = `rotate(${anguloActual}deg)`;
    }

    async function escanearRecibo() {
        const mensaje = document.getElementById('mensaje');
        if (!imagenOriginal.src) {
            alert("Primero toma una foto.");
            return;
        }

        btnEscanear.disabled = true;
        btnEscanear.textContent = "Leyendo recibo...";
        mensaje.style.color = "#333";
        mensaje.textContent = "Procesando imagen con IA...";

        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        let width = imagenOriginal.width;
        let height = imagenOriginal.height;

        // Configuramos el canvas según la rotación
        if (anguloActual === 90 || anguloActual === 270) {
            canvas.width = height;
            canvas.height = width;
        } else {
            canvas.width = width;
            canvas.height = height;
        }

        ctx.clearRect(0, 0, canvas.width, canvas.height);
        ctx.save();
        ctx.translate(canvas.width / 2, canvas.height / 2);
        ctx.rotate((anguloActual * Math.PI) / 180);
        ctx.drawImage(imagenOriginal, -width / 2, -height / 2);
        ctx.restore();

        // Creamos una copia recortada automáticamente enfocándonos en la mitad inferior del recibo 
        // (que es donde están exactamente el consumo y el total con asteriscos `***138.60`)
        let cropCanvas = document.createElement('canvas');
        let cropCtx = cropCanvas.getContext('2d');
        
        let targetWidth = canvas.width;
        let targetHeight = Math.floor(canvas.height * 0.55); // Tomamos el 55% inferior de la imagen
        let startY = Math.floor(canvas.height * 0.45); // Empezando desde casi la mitad hacia abajo

        cropCanvas.width = targetWidth;
        cropCanvas.height = targetHeight;
        cropCtx.drawImage(canvas, 0, startY, targetWidth, targetHeight, 0, 0, targetWidth, targetHeight);

        let imageToScan = cropCanvas.toDataURL('image/jpeg');

        try {
            // Analizamos tanto la imagen completa (para el mes) como la recortada (para asegurar el monto exacto)
            const { data: { text: textCompleto } } = await Tesseract.recognize(canvas.toDataURL('image/jpeg'), 'spa');
            const { data: { text: textRecortado } } = await Tesseract.recognize(imageToScan, 'spa');
            
            console.log("Texto inferior detectado:\n", textRecortado);

            // 1. Mes Facturado (lo leemos de la imagen completa)
            const matchMes = textCompleto.match(/(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Setiembre|Octubre|Noviembre|Diciembre)[-\s]?\d{4}/i);
            if (matchMes) document.getElementById('mes').value = matchMes[0];

            // 2. Consumo en kWh (lo buscamos preferentemente en la zona baja/recortada)
            const matchConsumo = textRecortado.match(/CONSUMO\s*FACTURADO\D*([\d,.]+)/i) || textRecortado.match(/([\d,.]+)\s*kWh/i);
            if (matchConsumo) {
                document.getElementById('consumo').value = matchConsumo[1];
            } else {
                // Respaldo completo
                const matchConsumoFull = textCompleto.match(/CONSUMO\s*FACTURADO\D*([\d,.]+)/i) || textCompleto.match(/([\d,.]+)\s*kWh/i);
                if (matchConsumoFull) document.getElementById('consumo').value = matchConsumoFull[1];
            }

            // 3. Total a Pagar: Buscamos obligatoriamente el número con asteriscos en la sección recortada inferior
            const matchAsteriscos = textRecortado.match(/\*{2,}\s*([\d,.]+)/);
            if (matchAsteriscos) {
                document.getElementById('monto').value = matchAsteriscos[1].replace(',', '.');
            } else {
                // Respaldo global buscando asteriscos en toda la hoja
                const matchAsteriscosFull = textCompleto.match(/\*{2,}\s*([\d,.]+)/);
                if (matchAsteriscosFull) {
                    document.getElementById('monto').value = matchAsteriscosFull[1].replace(',', '.');
                } else {
                    // Si no hay asteriscos, buscamos el último decimal grande de la zona recortada
                    const numerosRecortados = textRecortado.match(/\d+[\.,]\d{2}/g);
                    if (numerosRecortados && numerosRecortados.length > 0) {
                        document.getElementById('monto').value = numerosRecortados[numerosRecortados.length - 1].replace(',', '.');
                    }
                }
            }

            mensaje.style.color = "green";
            mensaje.textContent = "¡Datos extraídos con éxito! Revisa y guarda.";
        } catch (error) {
            console.error(error);
            mensaje.style.color = "red";
            mensaje.textContent = "No se pudo leer automáticamente. Ingresa los datos manualmente.";
        } finally {
            btnEscanear.disabled = false;
            btnEscanear.textContent = "1. Analizar Foto Escaneada";
        }
    }

    // Envío a Google Sheets
    document.getElementById('luzForm').addEventListener('submit', function(e) {
        e.preventDefault();
        const btnEnviar = document.getElementById('btnEnviar');
        const mensaje = document.getElementById('mensaje');
        btnEnviar.disabled = true;
        btnEnviar.textContent = "Guardando...";
        mensaje.style.color = "#333";
        mensaje.textContent = "Enviando a Google Sheets...";

        const datos = {
            mes: document.getElementById('mes').value,
            consumo: document.getElementById('consumo').value,
            monto: document.getElementById('monto').value
        };

        fetch(urlGoogleScript, {
            method: 'POST',
            mode: 'no-cors',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify(datos)
        })
        .then(() => {
            mensaje.style.color = "green";
            mensaje.textContent = "¡Registrado correctamente en Google Sheets!";
            this.reset();
            preview.style.display = 'none';
            btnRotar.style.display = 'none';
            btnEscanear.style.display = 'none';
            inputFoto.value = '';
            btnEnviar.disabled = false;
            btnEnviar.textContent = "Guardar en Google Sheet";
        })
        .catch(error => {
            console.error(error);
            mensaje.style.color = "red";
            mensaje.textContent = "Error al conectar con Google Sheets.";
            btnEnviar.disabled = false;
            btnEnviar.textContent = "Guardar en Google Sheet";
        });
    });
</script>

</body>
</html>
